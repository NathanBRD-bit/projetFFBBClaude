name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une PR qui reçoit un nouveau commit annule le run précédent : pas de file d'attente inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` et non `npm install` : installation reproductible depuis package-lock.json.
      - name: Installer les dépendances
        run: npm ci

      # Chaque étape est bloquante. Aucun `continue-on-error`, aucun `|| true` :
      # une étape rouge doit arrêter le job (docs/qualite.md).
      - name: Vérifier le formatage
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Vérifier les types
        run: npm run types

      - name: Tests unitaires et de composants avec couverture
        run: npm run test:couverture

      - name: Build de production
        run: npm run build

# À venir :
# - T03 : service Postgres (`services: postgres:...`) et migrations Drizzle, pour les
#   tests d'intégration qui touchent la base.
# - Tâche e2e : job dédié `playwright` (installation des navigateurs via
#   `npx playwright install --with-deps chromium`, puis `npm run test:e2e`), séparé de
#   ce job pour ne pas ralentir le retour sur les PR.
